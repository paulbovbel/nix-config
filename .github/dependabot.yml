version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: sunday
    # Private SSH inputs are updated manually; Dependabot cannot access them.
    ignore:
      - dependency-name: locus-vpn-client
      - dependency-name: vscode-workspace-populator
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
