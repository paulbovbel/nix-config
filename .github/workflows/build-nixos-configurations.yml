name: Build NixOS configurations

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-nixos-configurations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, nix-media]
    outputs:
      build-hosts: ${{ steps.inventory.outputs.build-hosts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Nix
        run: nix --version

      - name: Read build host inventory
        id: inventory
        run: printf 'build-hosts=%s\n' "$(nix eval --json .#lib.ciHostNames)" >> "$GITHUB_OUTPUT"

      - name: Check repository
        run: |
          set -euo pipefail
          nix develop --command just check

  evaluate:
    needs: check
    runs-on: [self-hosted, nix-media]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Evaluate all hosts
        run: nix develop --command just nix-eval

      - name: Check module contracts
        run: nix develop --command just nix-contracts

  test:
    needs: [check, evaluate]
    runs-on: [self-hosted, nix-media]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Nix
        run: nix --version

      - name: Run NixOS integration tests
        run: nix develop --command just nix-test

  build:
    needs: [check, test]
    runs-on: [self-hosted, nix-media]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        host: ${{ fromJSON(needs.check.outputs.build-hosts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Nix
        run: nix --version

      - name: Authenticate with Attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        continue-on-error: true
        run: nix run nixpkgs#attic-client -- login bovbel https://nix-cache.bovbel.com "$ATTIC_TOKEN"

      - name: Build ${{ matrix.host }}
        run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --out-link "result-${{ matrix.host }}"

      - name: Push ${{ matrix.host }} to Attic
        continue-on-error: true
        run: |
          nix run nixpkgs#attic-client -- push bovbel:nixos "result-${{ matrix.host }}"
