name: Build NixOS configurations

on:
  pull_request:
  push:

concurrency:
  group: build-nixos-configurations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, nix-media]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Nix
        run: nix --version

      - name: Check repository
        run: |
          set -euo pipefail
          nix develop --command just check

  build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/update_flake_lock_action')
    needs: check
    runs-on: [self-hosted, nix-media]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        host: [white-tower, rainbow-wave, pbovbel-dell, media]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Nix
        run: nix --version

      - name: Authenticate with Attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        continue-on-error: true
        run: nix run nixpkgs#attic-client -- login bovbel https://nix-cache.bovbel.com "$ATTIC_TOKEN"

      - name: Build ${{ matrix.host }}
        run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --out-link "result-${{ matrix.host }}"

      - name: Push ${{ matrix.host }} to Attic
        continue-on-error: true
        run: |
          nix run nixpkgs#attic-client -- push bovbel:nixos "result-${{ matrix.host }}"
