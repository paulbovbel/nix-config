name: Build NixOS configurations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # Preserve every main run; superseded PR runs can still be cancelled.
  group: build-nixos-configurations-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check repository
    # Never execute fork code on the persistent runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nix-media]
    timeout-minutes: 15
    outputs:
      build-hosts: ${{ steps.inventory.outputs.build-hosts }}
      kernel-cached: ${{ steps.kernel.outputs.cached }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          lfs: true
      - name: Read CI inventory
        id: inventory
        run: |
          hosts="$(nix eval --json .#lib.ciHostNames)"
          [[ "$hosts" != '[]' ]]
          printf 'build-hosts=%s\n' "$hosts" >> "$GITHUB_OUTPUT"
      - name: Check repository
        run: nix develop --command just check
      - name: Prepare native ARM kernel build
        id: kernel
        run: nix develop --command bash modules/github-runner/scripts/prepare-arm-kernel.sh "$RUNNER_TEMP/arm-kernel"
      - name: Upload kernel build recipe
        if: steps.kernel.outputs.cached != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm-kernel-recipe
          path: ${{ runner.temp }}/arm-kernel
          retention-days: 1
          compression-level: 0

  arm-kernel:
    name: Native ARM kernel
    needs: check
    if: needs.check.outputs.kernel-cached != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org https://nix-community.cachix.org https://nix-cache.bovbel.com/nixos
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nixos:H0/odUxYOFF1DaN52oWwcKlHUkXIZmrqb8QywcCYvd4=
      - name: Download kernel build recipe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arm-kernel-recipe
          path: ${{ runner.temp }}/arm-kernel
      - name: Build and cache native kernel
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: bash modules/github-runner/scripts/build-arm-kernel.sh "$RUNNER_TEMP/arm-kernel"

  test:
    name: Evaluate and test
    needs: [check, arm-kernel]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.arm-kernel.result == 'success' || needs.arm-kernel.result == 'skipped') }}
    runs-on: [self-hosted, nix-media]
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          lfs: true
      - name: Build flake checks
        run: nix develop --command just test all
      - name: Publish validated checks
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run .#attic-client -- login bovbel https://nix-cache.bovbel.com "$ATTIC_TOKEN"
          nix build --keep-going -L .#ci-checks --out-link "$RUNNER_TEMP/result-ci-checks"
          nix run .#attic-client -- push bovbel:nixos "$RUNNER_TEMP/result-ci-checks"
      - name: Build documentation artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nix build .#module-docs --out-link "$RUNNER_TEMP/result-docs"
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/result-docs

  build:
    name: Host (${{ matrix.host }})
    needs: [check, test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: [self-hosted, nix-media]
    # The ARM kernel is already cached; other uncached ARM packages use binfmt.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        host: ${{ fromJSON(needs.check.outputs.build-hosts) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          lfs: true
      - name: Build host
        env:
          HOST: ${{ matrix.host }}
        run: nix build -L ".#nixosConfigurations.$HOST.config.system.build.toplevel" --out-link "$RUNNER_TEMP/result-host"
      - name: Publish validated host
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run .#attic-client -- login bovbel https://nix-cache.bovbel.com "$ATTIC_TOKEN"
          nix run .#attic-client -- push bovbel:nixos "$RUNNER_TEMP/result-host"

  deploy-tailnet-policy:
    name: Deploy tailnet policy
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [check, test, build]
    runs-on: [self-hosted, nix-media]
    timeout-minutes: 10
    concurrency:
      group: tailnet-policy
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          lfs: true
      - name: Apply validated policy
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            printf 'Skipping superseded policy deployment.\n'
            exit 0
          fi
          nix develop --command just tailnet apply

  deploy-grafana:
    name: Deploy Grafana dashboards
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [check, test, build]
    runs-on: [self-hosted, nix-media]
    timeout-minutes: 10
    concurrency:
      group: grafana-dashboards
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          lfs: true
      - name: Apply validated dashboards
        env:
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            printf 'Skipping superseded dashboard deployment.\n'
            exit 0
          fi
          nix develop --command just --yes monitor apply

  publish-docs:
    name: Deploy GitHub Pages
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [check, test, build]
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy validated documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
