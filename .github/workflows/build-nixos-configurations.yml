name: Build NixOS configurations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # Preserve every main run; superseded PR runs can still be cancelled.
  group: build-nixos-configurations-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Never execute fork code on the persistent runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nix-media]
    timeout-minutes: 15
    outputs:
      build-hosts: ${{ steps.inventory.outputs.build-hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read CI inventory
        id: inventory
        run: |
          hosts="$(nix eval --json .#lib.ciHostNames)"
          [[ "$hosts" != '[]' ]]
          printf 'build-hosts=%s\n' "$hosts" >> "$GITHUB_OUTPUT"
      - name: Check repository
        run: nix develop --command just check

  test:
    name: Evaluate and test
    needs: check
    runs-on: [self-hosted, nix-media]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build flake checks
        run: nix develop --command just nix-test
      - name: Build documentation artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nix build .#module-docs --out-link "$RUNNER_TEMP/result-docs"
      - name: Upload validated documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/result-docs

  build:
    name: Host (${{ matrix.host }})
    needs: [check, test]
    runs-on: [self-hosted, nix-media]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        host: ${{ fromJSON(needs.check.outputs.build-hosts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build host
        env:
          HOST: ${{ matrix.host }}
        run: nix build --no-link -L ".#nixosConfigurations.$HOST.config.system.build.toplevel"

  publish-cache:
    name: Publish cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test, build]
    runs-on: [self-hosted, nix-media]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Publish validated hosts
        id: cache
        continue-on-error: true
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run .#attic-client -- login bovbel https://nix-cache.bovbel.com "$ATTIC_TOKEN"
          nix build --keep-going -L .#ci-hosts --out-link "$RUNNER_TEMP/result-ci-hosts"
          nix run .#attic-client -- push bovbel:nixos "$RUNNER_TEMP/result-ci-hosts"
      - name: Report cache failure
        if: always() && steps.cache.outcome == 'failure'
        run: printf '::warning::Cache publication failed; see the publication job logs.\n'

  publish-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test, build]
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy validated documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
