name: Check NixOS Host Builds

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: check-host-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable upstream binary caches
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Use nix-community Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community

      - name: Use cuda-maintainers Cachix
        uses: cachix/cachix-action@v15
        with:
          name: cuda-maintainers

      - name: Configure project Cachix cache
        uses: cachix/cachix-action@v15
        with:
          name: paulbovbel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-check
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-

      - name: Run full check suite
        run: |
          set -euo pipefail
          nix run nixpkgs#just -- all

  build-hosts:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        host:
          - white-tower
          # - pbovbel-dell
          # - media
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable upstream binary caches
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Use nix-community Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community

      - name: Use cuda-maintainers Cachix
        uses: cachix/cachix-action@v15
        with:
          name: cuda-maintainers

      - name: Configure project Cachix cache
        uses: cachix/cachix-action@v15
        with:
          name: paulbovbel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ matrix.host }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-

      - name: Build host toplevel
        run: |
          set -euo pipefail
          nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --dry-run
