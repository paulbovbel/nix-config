name: Check NixOS Host Builds

on:
  pull_request:
  push:
    branches:
      - main

env:
  NIX_SUBSTITUTERS: https://cache.nixos.org https://paulbovbel.cachix.org https://nix-community.cachix.org https://cuda-maintainers.cachix.org
  NIX_TRUSTED_PUBLIC_KEYS: cache.nixos.org-1:6NCHdD59X431o0gWypbOJTs4f2vT5M9T8qN9kYChdD4= paulbovbel.cachix.org-1:9WWi/8x8my7+Hs6/ZmuYCBU3guG1zw7da/4nkZ+vViQ= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cuda-maintainers.cachix.org-1:0dq3bujKpuEPMCX6U4WylrUDZ9JyUG0VpVZa7CNfq5E=

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            substituters = ${{ env.NIX_SUBSTITUTERS }}
            trusted-public-keys = ${{ env.NIX_TRUSTED_PUBLIC_KEYS }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-check
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-

      - name: Run full check suite
        run: |
          set -euo pipefail
          nix run nixpkgs#just -- all

  build-hosts:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        host:
          - white-tower
          # - pbovbel-dell
          # - media
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            substituters = ${{ env.NIX_SUBSTITUTERS }}
            trusted-public-keys = ${{ env.NIX_TRUSTED_PUBLIC_KEYS }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ matrix.host }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-

      - name: Build host toplevel
        run: |
          set -euo pipefail
          nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
