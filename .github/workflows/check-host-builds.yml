name: Check NixOS Host Builds

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-config:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - white-tower
          # - pbovbel-dell
          # - media
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ matrix.host }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-

      - name: Run full check suite
        run: |
          set -euo pipefail
          nix run nixpkgs#just -- all

      - name: Build host toplevel
        run: |
          set -euo pipefail
          nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
