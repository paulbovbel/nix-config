name: Test NixOs Configurations

on:
  pull_request:
  push:

concurrency:
  group: test-nixos-configurations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nix runner
        uses: ./.github/actions/setup-nix
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run check suite
        run: |
          set -euo pipefail
          nix run nixpkgs#just -- check

  build-hosts:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        host:
          - white-tower
          - pbovbel-dell
          - rainbow-wave
          - media
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nix runner
        uses: ./.github/actions/setup-nix
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build host
        run: |
          set -euo pipefail
          nix run nixpkgs#just -- dry-run "${{ matrix.host }}"
