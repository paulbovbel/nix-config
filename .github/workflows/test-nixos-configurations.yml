name: Test NixOs Configurations

on:
  pull_request:
  push:

concurrency:
  group: test-nixos-configurations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.inventory.outputs.hosts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nix runner
        uses: ./.github/actions/setup-nix
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run check suite
        run: |
          set -euo pipefail
          nix develop --command just check

      - name: Read host inventory
        id: inventory
        run: echo "hosts=$(nix eval --json .#lib.hostNames)" >> "$GITHUB_OUTPUT"

  build-hosts:
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.check.outputs.hosts) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nix runner
        uses: ./.github/actions/setup-nix
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build host
        run: |
          set -euo pipefail
          nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

      - name: Push host closure to Attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          nix run nixpkgs#attic-client -- login bovbel https://nix-cache.bovbel.com "$ATTIC_TOKEN"
          nix run nixpkgs#attic-client -- push bovbel:nixos ./result
