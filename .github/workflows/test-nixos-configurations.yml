name: Test NixOs Configurations

on:
  pull_request:
  push:

concurrency:
  group: test-nixos-configurations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable upstream binary caches
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Use nix-community Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community

      - name: Use cuda-maintainers Cachix
        uses: cachix/cachix-action@v15
        with:
          name: cuda-maintainers

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run check suite
        run: |
          set -euo pipefail
          nix run nixpkgs#just -- check

  build-hosts:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        host:
          - white-tower
          - pbovbel-dell
          - media
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable upstream binary caches
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Use nix-community Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community

      - name: Use cuda-maintainers Cachix
        uses: cachix/cachix-action@v15
        with:
          name: cuda-maintainers

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Dry-run host toplevel build
        run: |
          set -euo pipefail
          nix run nixpkgs#just -- dry-run "${{ matrix.host }}"
