name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: update-deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: [self-hosted, nix-media]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Nix
        run: nix --version

      - name: Update flake inputs
        run: nix flake update

      - name: Update Caddy plugins
        run: nix develop --command python3 modules/caddy/update.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create Nix dependency update PR
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}
          add-paths: |
            flake.lock
            modules/caddy/container.nix
          branch: update-nix-dependencies
          commit-message: "Update Nix dependencies"
          delete-branch: true
          title: "Update Nix dependencies"
          body: "Automated updates to Nix flake inputs and Caddy plugins."
          labels: |
            dependencies
            automated
