<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>404 — Page Not Found</title>
  <style>
    @theme@
    :root {
      line-height: 1.5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      color: var(--hal-text);
      background: var(--hal-background);
    }

    main {
      width: 100%;
      max-width: 36rem;
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid var(--hal-border);
      border-radius: var(--hal-radius);
      box-shadow: var(--hal-shadow);
      text-align: center;
    }

    .avatar {
      display: block;
      width: min(65vw, 18rem);
      max-width: 100%;
      height: auto;
      margin: 0 auto 2rem;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 500;
      letter-spacing: 0.15em;
    }

    .message {
      margin: 0 0 2rem;
      font-size: clamp(1rem, 4vw, 1.25rem);
    }

    .dashboard {
      display: inline-block;
      padding: 0.5rem;
      color: var(--hal-text);
      text-underline-offset: 0.25em;
    }

  </style>
</head>
<body>
  <main aria-labelledby="title">
    <h1 id="title">404</h1>
    <img class="avatar" src="@avatar@" alt="HAL 9000" width="288" height="288" @avatar-hidden@>
    <p class="message">I'm sorry Dave, I can't find that page.</p>
    <a class="dashboard" href="@dashboard@">Application Dashboard</a>
  </main>
</body>
</html>
